<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Core Tags -->
    <title>ChowkSpot - Direct & Zero-Commission Local Service Marketplace</title>
    <meta
      name="title"
      content="ChowkSpot - Direct & Zero-Commission Local Service Marketplace"
    />
    <meta
      name="description"
      content="Connect directly with verified skilled professionals across Himachal, Tricity, and North India with 0% platform commission and direct P2P settlements."
    />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChowkSpot" />
    <meta property="og:url" content="https://chowkspot.vercel.app/" />
    <meta
      property="og:title"
      content="ChowkSpot - Direct & Zero-Commission Local Service Marketplace"
    />
    <meta
      property="og:description"
      content="Connect directly with verified skilled professionals across Himachal, Tricity, and North India with 0% platform commission and direct P2P settlements."
    />

    <!-- WhatsApp Requirements: Absolute URL + PNG/JPEG Format + Explicit Dimensions -->
    <meta property="og:image" content="https://chowkspot.vercel.app/social-preview.png" />
    <meta
      property="og:image:secure_url"
      content="https://chowkspot.vercel.app/social-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="ChowkSpot - Direct & Zero-Commission Local Service Marketplace"

    />

      name="twitter:image"
      content="https://chowkspot.vercel.app/social-preview.png"
