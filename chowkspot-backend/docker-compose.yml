services:
  postgres:
    image: postgres:18-alpine
    container_name: chowkspot_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgdev123}
      POSTGRES_DB: ${POSTGRES_DB:-chowkspot_db}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chowkspot_db']
      interval: 3s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chowkspot_api
    restart: always
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      # Automatically construct using compose environment variables:
      DATABASE_URL: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pgdev123}@postgres:5432/${POSTGRES_DB:-chowkspot_db}'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
